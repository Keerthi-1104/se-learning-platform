name: se_learning_platform
description: "AI-powered Software Engineer Learning Platform — Beginner to Tech Lead."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.2

dev_dependencies:
  flutter_lints: ^5.0.0

# Bundled assets = the STARTER PACK only: roadmap + Level 1.
# Everything else streams from the CDN and caches to Hive on demand.
# See ContentService for the fetch/cache/fallback flow.
flutter:
  uses-material-design: true
  assets:
    - assets/content/roadmap.json
    - assets/content/level_01/
