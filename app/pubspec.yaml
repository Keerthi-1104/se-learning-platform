name: se_learning_platform
description: "AI-powered Software Engineer Learning Platform — Beginner to Tech Lead."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/level_01/
    - assets/content/level_02/
    - assets/content/level_03/
    - assets/content/level_04/
    - assets/content/level_05/
    - assets/content/level_06/
    - assets/content/level_07/
    - assets/content/level_08/
    - assets/content/level_09/
    - assets/content/level_10/
    - assets/content/level_11/
